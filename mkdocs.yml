site_name: JAX-CIP
site_description: JAX functions as nonlinear expressions in the SCIP optimization solver
repo_url: https://github.com/nardi/jax-cip
repo_name: nardi/jax-cip

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: null
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation: installation.md
  - Theory:
      - Nonlinear solving in SCIP: theory/scip.md
      - JAX functions in SCIP: theory/jax.md
      - References: theory/references.md
  - User guide:
      - Basic usage: guide/basic.md
      - Parameters and batches: guide/parameters.md
      - Options and statistics: guide/options.md
      - Performance: guide/performance.md
      - Comparison with native SCIP: guide/comparison.md
  - API reference:
      - Problems: api/problems.md
      - Compiling and solving: api/solving.md
      - Options: api/options.md
      - Results and statistics: api/results.md
