name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up
        uses: ./.github/actions/setup
        with:
          tracing: "false"

      - name: Run benchmarks
        # The empty `addopts` drops the `--benchmark-skip` that plain test runs use.
        run: uv run --no-sync pytest benchmarks -o addopts="" --benchmark-only --benchmark-json=benchmark.json -p no:cacheprovider

      - name: Compare with baseline
        # Shared runners are noisy, so this comparison only warns and never fails the job.
        continue-on-error: true
        run: uv run --no-sync python benchmarks/compare.py benchmark.json benchmarks/baseline.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
