name: Set up JAX-CIP
description: Installs uv, Python, the PJRT CPU plugin and the project with its dependencies.

inputs:
  python-version:
    description: Python version to install the project for.
    required: false
    default: ""
  tracing:
    description: Whether to build the Cython modules with line tracing for coverage.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    # Meson downloads the SCIP JLL tarballs into this directory on configure. Their
    # versions are pinned by the lock file, so its hash identifies the contents.
    - name: Cache JLL tarballs
      uses: actions/cache@v4
      with:
        path: subprojects/packagecache
        key: jll-${{ runner.os }}-${{ hashFiles('meson-jll.lock') }}

    - name: Cache PJRT plugin
      uses: actions/cache@v4
      with:
        path: ~/.cache/jaxcip/pjrt
        key: pjrt-${{ runner.os }}-${{ hashFiles('scripts/fetch_pjrt_plugin.sh') }}

    - name: Fetch PJRT plugin
      shell: bash
      run: |
        if [ ! -f ~/.cache/jaxcip/pjrt/libpjrt_cpu.so ]; then
          scripts/fetch_pjrt_plugin.sh ~/.cache/jaxcip/pjrt
        fi
        echo "JAXCIP_PJRT_PLUGIN=$HOME/.cache/jaxcip/pjrt/libpjrt_cpu.so" >> "$GITHUB_ENV"

    - name: Sync dependencies
      shell: bash
      run: |
        if [ -n "${{ inputs.python-version }}" ]; then
          uv sync --locked --python ${{ inputs.python-version }}
        else
          uv sync --locked
        fi

    # `--no-config` drops the coverage setting of `pyproject.toml`. Later steps run with
    # `uv run --no-sync`, so uv does not build the package again with it.
    - name: Build without line tracing
      if: inputs.tracing == 'false'
      shell: bash
      run: |
        uv pip install --no-config --no-deps --no-build-isolation --reinstall -e . \
          -C setup-args=-Dcoverage=false
